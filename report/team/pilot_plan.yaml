# Lab 13 · Nhiệm vụ D · Kế hoạch pilot trợ lý hoàn phí LogiX-VN (Gate 2a)
# Điền mọi chỗ có dấu hỏi. Khi nộp, ngoài các dòng chú thích không còn dấu hỏi nào.
# Kiểm tra đọc được: python -c "import yaml; yaml.safe_load(open('../report/team/pilot_plan.yaml'))"
#
# D1 · Cỡ mẫu (baseline 0,70; mục tiêu +5 điểm; alpha 0,05; power 0,8; ICC 0,02)
#   a) Chia theo yêu cầu: co_mau(0.70, 0.75) = 1.251 yêu cầu mỗi nhóm (2.502 tổng)
#   b) Theo nhân viên, m = 75: DE = 1 + 74 * 0,02 = 2,48 -> 3.103 mỗi nhóm -> 42 người/nhóm (84 > 40 hiện có: không đủ)
#   c) 20 nhân viên mỗi nhóm: giới hạn hiệu dụng c / ICC = 20 / 0,02 = 1.000 < 1.251 (không đạt mức chênh 5 điểm)
#   d) 6 depot mỗi nhóm: giới hạn hiệu dụng 6 / 0,02 = 300 < 1.251 và chỉ có 6 cụm (< 20 cụm: loại)
#   e) Mức chênh 6 điểm (859 mỗi nhóm), 20 nhân viên mỗi nhóm: giải 20m / (1 + 0,02*(m - 1)) >= 859 -> m >= 299 yêu cầu/người (DE = 6,96)
#
# D2 · Năm câu kiểm tra "tách được tác động" với cách chia đã chọn (mỗi câu một dòng):
#   1. Đối chứng chạy cùng thời gian: Có, 20 nhân viên đối chứng chạy song song cùng tuần trên cùng 12 depot.
#   2. Chia ngẫu nhiên hay do người chọn: Bốc thăm ngẫu nhiên bằng code với seed ghi trước, phân tầng theo depot (20 đối chứng / 20 can thiệp).
#   3. Ảnh hưởng gián tiếp và cách giảm: Có rủi ro nhân viên cùng depot trao đổi gợi ý; giảm bằng cấp quyền trợ lý theo tài khoản cá nhân và ghi log lượt mở theo staff_id.
#   4. Chỉ số chính, ngưỡng, ngày quyết định đã viết trước: Có, đã khóa chỉ số dong_trong_24h_khong_mo_lai_7_ngay, MDE 0,06, 3 luật dừng và ngày quyết định 2027-01-05 trước khi chạy.
#   5. Ít nhất 20 cụm mỗi nhóm: Có, đúng 20 nhân viên mỗi nhóm (20 cụm đối chứng và 20 cụm can thiệp).
#
# Đánh đổi đã chấp nhận (nếu cách chia chưa đạt cả hai điều kiện): Chấp nhận nâng MDE từ +5 điểm lên +6 điểm (859 hiệu dụng/nhóm, m >= 299 yêu cầu/nhân viên, DE = 6,96) để giữ đủ 20 cụm/nhóm và tránh spillover theo yêu cầu. Con số bất lợi: nếu tác động thật chỉ đạt +5 điểm thì power giảm xuống còn 0,64 (n = 859, alpha = 0,05).
#
# Tỉ lệ mo_lai_trong_7_ngay hiện tại và ngưỡng an toàn đã chọn: Hiện tại 4,25% (51/1.200 toàn mẫu) và 3,97% (39/982 phạm vi noi_dia + hang_nang); không đặt trần cứng dưới 4% vì sẽ dừng ngay tuần đầu; chọn ngưỡng so với đối chứng >= +2 điểm phần trăm hoặc vượt trần tuyệt đối 6%.

